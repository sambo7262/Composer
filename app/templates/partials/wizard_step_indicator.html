{# Phase 6 Plan 03 — wizard step indicator (5 dots; current in accent). #}
<div class="flex items-center gap-2 text-[13px] text-text-secondary">
  {% for i in range(1, 6) %}
    <span class="w-2 h-2 rounded-full {% if i < current_step_num %}bg-accent{% elif i == current_step_num %}bg-accent ring-2 ring-accent/30{% else %}bg-surface-elevated{% endif %}"></span>
  {% endfor %}
  <span class="ml-2">Step {{ current_step_num }} of 5{% if current_step_label %} · {{ current_step_label }}{% endif %}</span>
</div>
